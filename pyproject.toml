[project]
name = "abp-agent"
version = "0.1.0"
description = "Answers ABP Framework questions from its docs and source code"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "neo4j>=5.26,<6",               # llama-index-graph-stores-neo4j pins the 5.x driver
    "httpx>=0.27",
    "prefect>=3.4,<4",
    "streamlit>=1.40",
    # Phase 3: sources and search
    "llama-index-core>=0.14",
    "llama-index-embeddings-ollama>=0.8",
    "pgvector>=0.4",
    "tree-sitter>=0.25",
    "tree-sitter-c-sharp>=0.23",
    "mlflow>=3.17,<3.18",           # same minor as the tracking server
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abp_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the running Docker stack"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
