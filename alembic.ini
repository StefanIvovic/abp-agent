[alembic]
script_location = alembic
prepend_sys_path = src
# Dated file names (fastapi-best-practices): 2026-10-31_enable_extensions.py
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(slug)s
# The DB URL comes from abp_agent.config, see alembic/env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
