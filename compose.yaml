name: abp-agent

# Shared settings for every container built from our app image.
x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: abp-agent-app:dev
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    NEO4J_URI: bolt://neo4j:7687
    OLLAMA_BASE_URL: http://ollama:11434
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PREFECT_API_URL: http://prefect-server:4200/api
    API_URL: http://api:8000
    ABP_REPO_DIR: /sources/abp              # inside the container; .env holds the host path for the mount
    GIT_PYTHON_REFRESH: quiet               # MLflow probes for git, which isn't in the image
  extra_hosts:
    - "host.docker.internal:host-gateway"   # lets containers reach the LLM server on the host
  volumes:
    - ./evals:/app/evals                    # eval datasets/results, editable from the host
    # The ABP repository, read-only. ABP_REPO_DIR in .env overrides the default.
    - ${ABP_REPO_DIR:-../../Csharp/abp}:/sources/abp:ro

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: paradedb/paradedb:0.26.4-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5435:5432"]                    # host ports differ from the earlier prototype: both can run
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:2026.10-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports: ["7475:7474", "7688:7687"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama:
    image: ollama/ollama:0.40.13
    ports: ["11436:11434"]
    volumes:
      - ollama_data:/root/.ollama
    deploy:                                   # GPU: nomic needs ~400 MB VRAM; if the LLM has filled
      resources:                              # the card, Ollama falls back to CPU automatically
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:                                # one-shot: download the embedding model
    image: ollama/ollama:0.40.13
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${EMBED_MODEL}"]
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: abp-agent-mlflow:dev
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,localhost:5001,127.0.0.1,127.0.0.1:5000,127.0.0.1:5001
    ports: ["5001:5000"]
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  prefect-server:
    image: prefecthq/prefect:3.9.1-python3.12
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefect
      PREFECT_UI_API_URL: http://localhost:4201/api
    ports: ["4201:4200"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- our app (one image)
  migrate:                                    # one-shot: apply DB migrations
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "abp_agent.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8011:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      neo4j: { condition: service_healthy }
      ollama: { condition: service_healthy }
      mlflow: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
    develop:
      watch:
        - { action: sync+restart, path: ./src, target: /app/src }
        - { action: rebuild, path: ./pyproject.toml }
        - { action: rebuild, path: ./uv.lock }

  ui:
    <<: *app
    command: ["streamlit", "run", "src/abp_agent/ui/app.py", "--server.address=0.0.0.0", "--server.port=8501",
              "--browser.gatherUsageStats=false"]
    ports: ["8502:8501"]
    depends_on:
      api: { condition: service_healthy }
    develop:
      watch:
        - { action: sync+restart, path: ./src, target: /app/src }
        - { action: rebuild, path: ./uv.lock }

  pipelines:
    <<: *app
    command: ["python", "-m", "abp_agent.pipelines.serve"]
    depends_on:
      prefect-server: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      ollama: { condition: service_healthy }
    develop:
      watch:
        - { action: sync+restart, path: ./src, target: /app/src }
        - { action: rebuild, path: ./uv.lock }

volumes:
  postgres_data:
  neo4j_data:
  ollama_data:
  mlflow_artifacts:
